# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  min_sdk_android: 21

  image_path_android: "assets/images/ic_app_adr.png"

  adaptive_icon_background: "#080910"
  adaptive_icon_foreground: "assets/images/ic_app_adr.png"
  adaptive_icon_foreground_inset: 16

  ios: true
  image_path_ios: "assets/images/ic_app.png"
  remove_alpha_ios: true

  image_path_ios_dark_transparent: "assets/images/ic_app.png"
  image_path_ios_tinted_grayscale: "assets/images/ic_app.png"
  desaturate_tinted_to_grayscale_ios: true
