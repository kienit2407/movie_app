  fast_cached_network_image: ^1.3.3+5
  visibility_detector: ^0.4.0+2
  flutter_animate: ^4.5.2
  solid_annotations: ^1.0.0
  flutter_solidart: ^2.7.0
  flutter_hooks: ^0.21.3+1
  url_launcher: ^6.3.2
  youtube_player_flutter: ^9.1.1
  chewie: ^1.7.5
  video_player: ^2.8.2
  better_player_plus: ^1.0.8
  lottie: ^3.3.2
  liquid_glass_renderer: ^0.2.0-dev.4
  flutter_launcher_icons: ^0.14.4
  loading_animation_widget: ^1.3.0
  wakelock_plus: ^1.3.2
  go_router: ^17.1.0
  hydrated_bloc: ^9.1.5
  toastification: ^3.0.3
  flutter_native_splash: ^2.4.7
  video_thumbnail: ^0.5.6
  flutter_screenutil: ^5.9.3
  liquid_glass_widgets: ^0.10.10
  cupertino_native_better: ^1.5.4
  text_scroll: ^0.2.1
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^22.2.0
  image_picker: ^1.2.1
  image_cropper: ^11.0.0
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1
  stroke_text: ^1.0.0
  app_links: ^6.4.1
  share_plus: ^12.0.1
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  bounce: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.0
  json_serializable: ^6.10.0
  flutter_lints: ^5.0.0

dependency_overrides:
  fast_cached_network_image:
    path: third_party/fast_cached_network_image
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/svg/
    - assets/.env
  #   - images/a_dot_ham.jpeg


  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Black.ttf
          weight: 900
        - asset: assets/fonts/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Light.ttf
          weight: 300
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
